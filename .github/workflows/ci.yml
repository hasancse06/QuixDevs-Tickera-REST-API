name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        wordpress: ['6.8', '7.1.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: quixdevs_tickera_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      QUIXDEVS_WP_PATH: /tmp/quixdevs-wp
      WP_ENVIRONMENT_TYPE: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom, zip
          tools: composer, wp-cli
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Syntax, standards, static analysis and dependencies
        run: |
          find includes tests -name '*.php' -exec php -l {} \;
          php -l quixdevs-tickera-rest-api.php
          composer lint
          composer analyse
          composer audit --locked --no-interaction
          composer test:release
      - name: Install isolated WordPress and pinned Tickera
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          wp core download --version="$WORDPRESS_VERSION" --path="$QUIXDEVS_WP_PATH"
          wp config create --dbname=quixdevs_tickera_test --dbuser=root --dbpass=test-only-password --dbhost=127.0.0.1:3306 --path="$QUIXDEVS_WP_PATH"
          wp core install --url=http://localhost --title='QuixDevs CI' --admin_user=ci_admin --admin_password=ci-test-only-password --admin_email=ci@example.test --skip-email --path="$QUIXDEVS_WP_PATH"
          wp plugin install tickera-event-ticketing-system --version=3.6.0.8 --activate --path="$QUIXDEVS_WP_PATH"
          ln -s "$GITHUB_WORKSPACE" "$QUIXDEVS_WP_PATH/wp-content/plugins/quixdevs-tickera-rest-api"
          wp plugin activate quixdevs-tickera-rest-api --path="$QUIXDEVS_WP_PATH"
      - name: Real WordPress and Tickera ownership tests
        run: composer test
      - name: Build, freshly install and check production ZIP
        run: |
          python3 tools/build-release.py
          wp plugin deactivate quixdevs-tickera-rest-api --path="$QUIXDEVS_WP_PATH"
          rm "$QUIXDEVS_WP_PATH/wp-content/plugins/quixdevs-tickera-rest-api"
          wp plugin install "$GITHUB_WORKSPACE/dist/quixdevs-tickera-rest-api.zip" --activate --path="$QUIXDEVS_WP_PATH"
          composer test
          wp plugin install plugin-check --version=2.1.0 --activate --path="$QUIXDEVS_WP_PATH"
          wp plugin check quixdevs-tickera-rest-api --format=strict-json --path="$QUIXDEVS_WP_PATH" > .work/plugin-check.json
          python3 tools/verify-plugin-check.py .work/plugin-check.json
      - name: Lint workflows and scan source, history and extracted package
        run: |
          python3 tools/install-tools.py
          .work/tools/actionlint -shellcheck=
          .work/tools/gitleaks dir . --config=.gitleaks.toml --redact --no-banner
          .work/tools/gitleaks git . --config=.gitleaks.toml --redact --no-banner
          .work/tools/gitleaks dir "$QUIXDEVS_WP_PATH/wp-content/plugins/quixdevs-tickera-rest-api" --redact --no-banner
